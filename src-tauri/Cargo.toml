[package]
name = "bypass-cleaner"
version = "1.0.0"
description = "Smart file cleanup utility with live dashboard"
authors = ["ByPass"]
license = "Private"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]

[features]
ide-context-stub = []


[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
walkdir = "2.5"
